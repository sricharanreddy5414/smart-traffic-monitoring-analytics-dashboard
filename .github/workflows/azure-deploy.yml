name: Build and Azure Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  deploy-backend:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_AZURE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Include sample data in the Function App package
        run: |
          mkdir -p backend/data
          cp data/sample_traffic_data.json backend/data/sample_traffic_data.json

      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: backend
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          respect-funcignore: true

  deploy-frontend:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_AZURE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend with the deployed API address
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy frontend to Azure Storage static website
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          set -euo pipefail
          if ! command -v az >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi
          cd frontend/dist
          find . -type f -print0 > /tmp/site-files.txt
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            case "$rel" in
              *.html) ctype="text/html" ;;
              *.css) ctype="text/css" ;;
              *.js) ctype="text/javascript" ;;
              *.svg) ctype="image/svg+xml" ;;
              *.json) ctype="application/json" ;;
              *.png) ctype="image/png" ;;
              *.ico) ctype="image/x-icon" ;;
              *) ctype="application/octet-stream" ;;
            esac
            az storage blob upload \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --auth-mode key \
              --container '$web' \
              --name "$rel" \
              --file "$file" \
              --content-type "$ctype" \
              --overwrite true \
              --only-show-errors
          done < /tmp/site-files.txt
